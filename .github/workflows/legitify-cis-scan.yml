name: CIS GH Legitify Compliance Scan

on:
  pull_request: {}
  push:
    branches: 
    - master
    - main
  workflow_dispatch: {}


permissions:
  contents: read
  discussions: read
  issues: read
  pull-requests: read
  security-events: write

jobs:
  cis-compliance-scan:
    name: CIS Compliance Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Run Legitify CIS Scan
        uses: ./security-actions/scan-gh-cis
        with:
          github_token: ${{ secrets.LEGITIFY_TOKEN }}
          upload_code_scanning: 'true'  
          repositories: "pankajmouriyakong/httpsnippet"

  notify-slack:
    name: Slack Notification
    needs: [cis-compliance-scan]
    # if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    if: ${{ always()  }}
    uses: ./.github/workflows/slack-notif-main.yml
    with:
      workflow_name: "CIS Scan Workflow"
      job_status: ${{ contains(needs.*.result, 'failure') && 'failure' || contains(needs.*.result, 'success') && 'success' || 'failure' }}
    secrets:
      SLACK_WEBHOOK_URL_NOTIFY: ${{ secrets.SLACK_WEBHOOK_URL_NOTIFY_PUBLIC_SHARED_ACTIONS }}
      SLACK_WEBHOOK_URL_ALERT: ${{ secrets.SLACK_WEBHOOK_URL_ALERT_PUBLIC_SHARED_ACTIONS }}